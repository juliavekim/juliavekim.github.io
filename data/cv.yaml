projects:
- title: Personalised Instruction with Generative AI
  institution: MIT · PhD Research
  url: https://github.com/juliavekim/personalized_instruction
  points:
  - Developed a generative AI system for automated educational content creation and
    personalised instruction at MIT.
  - Designed a multi-stage LLM workflow for automated assessment authoring and personalised
    video generation.
  - Designed content reuse and precomputation, projecting 46% lower generation time
    from measured runtimes.
- title: 'EgoBlind-RA: Risk-Adaptive Visual Assistance'
  institution: MIT · Machine Learning Course Project
  url: https://github.com/juliavekim/EgoBlind-RA
  points:
  - Trained a CLIP urgency classifier for visual assistance to blind users, achieving
    0.905 test ROC-AUC.
  - Fine-tuned Kimi-VL with LoRA, reducing composite loss by 38% versus baseline on
    1,283 test examples.
  - Evaluated SFT and DPO training strategies, analysing preference-pair design and
    robustness to routing errors.
