<style>
.research-card-meta{margin-top:18px}.research-authors{display:flex;flex-wrap:wrap;gap:9px 15px;font-size:13px}.research-author{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none}.research-author:hover{text-decoration:underline}.research-author img{border-radius:50%;width:24px;height:24px;object-fit:cover}.research-card-meta time{display:block;margin-top:10px;font-size:12px;color:#6b7280}
.paper-authors{border-top:1px solid #dce3e0;margin:40px 0 20px;padding-top:26px}.paper-authors h2{font-size:22px;font-weight:650;margin-bottom:18px}.paper-author-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.paper-author{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid #dce3e0;border-radius:12px;text-decoration:none!important}.paper-author img,.author-initial{border-radius:50%;flex:0 0 56px;width:56px;height:56px;object-fit:cover}.author-initial{display:grid;place-items:center;background:#e5f2ed;color:#145941;font-size:22px}.paper-author strong{display:block;font-size:16px}.paper-author small{display:block;font-size:12px;line-height:1.5;margin-top:5px;color:#68766f}

)}.cv-award-group>h3{font-size:16px;font-weight:500;color:var(--cv-accent)}.cv-award-group ul{list-style:none;margin:0;padding:0;display:grid;gap:18px}.cv-award-group strong{font-size:14px;line-height:1.65;font-weight:550;display:block}.cv-award-group p{font-size:12px;line-height:1.65;color:var(--cv-muted);margin-top:3px}.cv-award-note{font-style:italic}.cv-end{border-top:1px solid var(--cv-line);padding-top:26px;font-size:14px;color:var(--cv-muted)}.cv-end a{display:inline-block;margin-top:8px;color:var(--cv-accent)}
