{{ if and .Params.authors (ne .Params.profile false) }}
<p class="publication-author-links">{{ range $i, $author := .GetTerms "authors" }}{{ if $i }}, {{ end }}{{ if eq .Title "Julia Kim" }}<span class="me">{{ .Title }}</span>{{ else }}<a href="{{ .Params.website | default .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}</p>
{{ end }}
