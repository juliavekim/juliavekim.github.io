<div class="research-authors" aria-label="Authors">
{{ range .GetTerms "authors" }}
  <a class="research-author" href="{{ .RelPermalink }}">
  {{ with (.Resources.ByType "image").GetMatch "*avatar*" }}
    {{ $img := .Fill "48x48 Center webp" }}<img src="{{ $img.RelPermalink }}" width="24" height="24" alt="" loading="lazy">
  {{ end }}
  <span>{{ .Title }}</span></a>
{{ end }}
</div>
