=Tutoring%20session\">email me</a> — I’d love to hear what you’re working on.", "Depuis <strong>dix ans</strong>, je donne des cours particuliers de <strong>mathématiques, de physique et de statistiques</strong>, du lycée à l’université.\nMon approche est <strong>chaleureuse, patiente et encourageante</strong>, et je suis heureuse d’avoir reçu <strong><a href=\"https://www.superprof.ca/mit-cambridge-masters-top-female-science-graduate-uoft-tutor-maths-physics-statistics-from-elementary-third-year.html\" target=\"_blank\" rel=\"noopener\">plusieurs avis cinq étoiles</a></strong> de mes élèves.\nSi vous souhaitez organiser une séance avec moi, <span class=\"email-envelope\" aria-hidden=\"true\">💌</span> <a href=\"mailto:julia225@mit.edu\">écrivez-moi</a> : je serais ravie de découvrir ce que vous étudiez.", "<strong>On yıldır</strong> lise ve üniversite öğrencilerine <strong>matematik, fizik ve istatistik</strong> dersleri veriyorum.\nSıcak, sabırlı ve cesaretlendirici bir yaklaşım benimsiyorum. Öğrencilerimden birçok <strong><a href=\"https://www.superprof.ca/mit-cambridge-masters-top-female-science-graduate-uoft-tutor-maths-physics-statistics-from-elementary-third-year.html\" target=\"_blank\" rel=\"noopener\">beş yıldızlı değerlendirme</a></strong> almış olmaktan mutluluk duyuyorum.\nBenimle bir ders ayarlamak isterseniz lütfen <span class=\"email-envelope\" aria-hidden=\"true\">💌</span> <a href=\"mailto:julia225@mit.edu\">bana e-posta gönderin</a> — neler üzerinde çalıştığınızı duymak isterim."], "link": "mailto:julia225@mit.edu?subject=Tutoring%20session", "linkText": ["Arrange a session ↗", "Réserver une séance ↗", "Ders planlayın ↗"], "credit": "Two Girls Reading — Pierre-Auguste Renoir", "source": "https://commons.wikimedia.org/wiki/File:Two_Girls_Reading_LACMA_M.68.46.1.jpg", "slug": "tutoring", "artTitle": "Two Girls Reading", "artist": "Pierre-Auguste Renoir", "year": "c. 1890–1891", "list": ["", "", ""]};function render(){const l=({en:0,fr:1,tr:2}[document.documentElement.lang]||0);const t=(a)=>a[l];document.querySelector('.service-detail').innerHTML=`<a class="back-research" href="/#services">← ${t(['Services','Services','Hizmetler'])}</a><div class="service-gallery"><figure class="service-artwork"><a href="/editorial/${d.image}" target="_blank" aria-label="${d.artTitle}"><img src="/editorial/${d.image}" alt="${d.credit}"></a><figcaption>${d.artist}, <cite>${d.artTitle}</cite>, ${d.year}</figcaption></figure><div class="service-detail-copy"><h1><span class="service-title-emoji" aria-hidden="true">📖</span> ${d.title[l]}</h1>${d.text[l].split('\n').map(x=>`<p>${x}</p>`).join('')}${d.list[l]}</div></div>`;}let current=document.documentElement.lang;new MutationObserver(()=>{if(current!==document.documentElement.lang){current=document.documentElement.lang;render()}}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});render()})();</script><script src="/editorial/service-email.js" defer></script><script src="/editorial/service-art.js" defer></script><script src="/editorial/services-nav.js" defer></script></body></html>
